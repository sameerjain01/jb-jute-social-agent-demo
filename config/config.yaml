company:
  name: "JuteVerde"
  tagline: "Sustainable Jute Solutions for Modern Business"
  description: >
    A small business specializing in sustainable jute products — including
    packaging, bags, textiles, home décor, and agricultural supplies.
    We help businesses replace plastic and synthetic materials with
    biodegradable, ethically sourced jute alternatives.
  website: "www.juteverde.com"
  voice: >
    Professional, warm, and educational. We are passionate experts, not
    preachy activists. We use data and specifics. We respect our audience's
    intelligence. We celebrate small wins as much as big ones.

content:
  # Formats cycle in order: educate → pitch → cta → educate → ...
  formats:
    - educate   # Share insight/fact, end with a question
    - pitch     # Problem → solution framing, jute as the answer
    - cta       # Drive one concrete action
  
  platform: "linkedin"          # affects tone and length
  min_words: 120
  max_words: 220
  hashtag_count: 4
  emoji_count: 3                # approx, used naturally

posting:
  # Cron: 9am UTC daily (change in workflow file to adjust timezone)
  cron: "0 9 * * *"
  max_retries: 3                # attempts before skipping a cycle
  # Don't reuse a topic if it appeared in the last N posts
  min_similarity_window: 8

guardrail:
  min_pass_score: 6             # posts scoring below this are rejected
  # Topics that are ALWAYS off-limits regardless of generation
  banned_topics:
    - politics
    - religion
    - personal attacks
    - competitor names
