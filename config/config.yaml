company:
  name: "Sarah's Bakery"
  tagline: "Artisan pastries, baked fresh every morning"
  description: >
    A neighborhood bakery in a college town near Philadelphia. We bake
    everything from scratch daily — French-style pastries, seasonal
    specials, celebration cakes, and premium gifting boxes. We serve
    students who need a great start to the day and families who want
    something worth celebrating.
  website: "www.sarahsbakes.com"
  voice: >
    Warm, specific, and real. We sound like the baker who actually made
    your croissant — not a brand manager. We share what goes into our
    work, celebrate the seasons, and talk to students and regulars like
    they're already in the door. No fluff. Every word earns its place.

content:
  # Formats cycle in order: educate → pitch → cta → educate → ...
  formats:
    - educate   # Share a baking fact, ingredient story, or process insight
    - pitch     # Why fresh artisan beats chain/supermarket
    - cta       # Drive one concrete action (visit, pre-order, DM)

  platform: "instagram"
  min_words: 80
  max_words: 150
  hashtag_count: 8
  emoji_count: 5                # more emoji for Instagram

posting:
  # Cron: 9am UTC daily
  cron: "0 9 * * *"
  max_retries: 3
  min_similarity_window: 8

guardrail:
  min_pass_score: 6
  banned_topics:
    - politics
    - religion
    - personal attacks
    - competitor names
    - health claims or medical advice
