name: 🧁 Sarah's Bakery Social Agent

on:
  schedule:
    - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering manually? (optional, for the log)"
        required: false
        default: "Manual demo run"
        type: string

permissions:
  contents: write

jobs:
  post:
    name: Generate & Publish Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Log trigger info
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Reason: ${{ github.event.inputs.reason || 'Scheduled run' }}"
          echo "Time: $(date -u)"

      - name: Run Social Media Agent
        env:
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:          ${{ secrets.SPREADSHEET_ID }}
        run: python src/main.py

      - name: Commit infographic
        run: |
          git config user.name "SB Bakery Agent"
          git config user.email "noreply@sarahsbakes.com"
          git add generated/*.png
          git diff --cached --quiet || git commit -m "chore: add infographic [skip ci]"
          git push
