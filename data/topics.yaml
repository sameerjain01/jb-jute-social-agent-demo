topics:
  # --- Student-focused ---
  - id: T01
    name: "The best pastry + coffee combo under $6 for a college morning"
    category: pitch
    hook: "Students have a budget. We worked backwards from it."

  - id: T02
    name: "Why a warm croissant at 8am beats the dining hall every time"
    category: educate
    hook: "It's not about the pastry — it's about how you start the day"

  - id: T03
    name: "Study fuel: what students actually want from their bakery stop"
    category: educate
    hook: "We asked. The answers changed our daily menu."

  - id: T04
    name: "The 'treat yourself' habit — why college students keep coming back"
    category: pitch
    hook: "Turns out a $4 muffin on a hard morning is the smartest $4 you'll spend"

  # --- Seasonal: Summer ---
  - id: T05
    name: "Fresh blueberry muffins vs frozen: the difference you taste immediately"
    category: educate
    hook: "Fresh blueberries picked this week. Not a mix. Not frozen. Here's why it matters."

  - id: T06
    name: "Peach danishes are back — what goes into making them from scratch"
    category: educate
    hook: "Stone fruit season lasts 6 weeks. We pack all of it into every bite."

  # --- Seasonal: Fall ---
  - id: T07
    name: "Pumpkin spice rolls: what separates ours from the chain version"
    category: educate
    hook: "We start with a real pumpkin. Not a flavouring. Here's what that actually looks like."

  - id: T08
    name: "Apple cinnamon turnovers — why fall is our favourite season to bake"
    category: educate
    hook: "The orchard down the road delivers Tuesdays. We bake Wednesdays."

  # --- Seasonal: Winter ---
  - id: T09
    name: "Hot cocoa croissants: the winter item people ask about all year"
    category: pitch
    hook: "We only make them from November. That's the point."

  - id: T10
    name: "Spiced ginger cookies: the recipe we've been refining since year one"
    category: educate
    hook: "Three types of ginger. One small tweak every December."

  # --- Seasonal: Spring ---
  - id: T11
    name: "Strawberry shortcake is back — and we use real local strawberries"
    category: pitch
    hook: "First week of June. Limited batches. Here's how to get yours."

  - id: T12
    name: "Lemon tarts: the most technically demanding thing we make all year"
    category: educate
    hook: "The curd has to be right. The shell has to be right. At the same time."

  # --- Premium pastries ---
  - id: T13
    name: "Why our almond croissants have a 3-hour wait some mornings"
    category: educate
    hook: "We make 24. When they're gone, they're gone. Here's what goes into each one."

  - id: T14
    name: "What goes into a layered celebration cake — and why it takes a full day"
    category: educate
    hook: "Six layers. Three fillings. One day of work. No shortcuts."

  - id: T15
    name: "French-style fruit tarts: the pastry you won't find at a chain"
    category: pitch
    hook: "Pastry cream, seasonal fruit, a shell that actually holds. You have to make it yourself."

  - id: T16
    name: "Chocolate ganache éclairs: why we only make them twice a week"
    category: educate
    hook: "They don't keep. So we don't make them in advance. That's the whole idea."

  # --- Gifting ---
  - id: T17
    name: "The pastry gift box: why it beats flowers for almost any occasion"
    category: pitch
    hook: "Flowers are gone in a week. A box of fresh pastries is gone in 20 minutes — and people remember it."

  - id: T18
    name: "Graduation season: why you should pre-order your custom cake now"
    category: cta
    hook: "May fills up by April. We take 8 custom orders per week. That's it."

  # --- Behind the scenes ---
  - id: T19
    name: "4am: what happens before the first customer walks in"
    category: educate
    hook: "The oven goes on at 4. Doors open at 7. Here's what happens in between."

  - id: T20
    name: "Artisan vs. mass-produced: the numbers that change how you think about your morning pastry"
    category: educate
    hook: "Chain bakeries bake once a day in a factory. We bake in three shifts. The difference is measurable."
