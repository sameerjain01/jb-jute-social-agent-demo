<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { width: 1080px; height: 1080px; overflow: hidden; }

  /* ── HERO: food photo background ── */
  .hero {
    width: 1080px;
    height: 400px;
    background: {{BG_CSS}};
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 0 18px;
  }
  /* gradient overlay so text is always readable */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(20,8,4,0.35) 0%,
      rgba(20,8,4,0.55) 55%,
      rgba(20,8,4,0.82) 100%
    );
  }

  .hero-inner {
    position: relative;
    z-index: 2;
    padding: 0 40px;
  }

  /* header row inside hero */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .brand-name {
    font-family: 'Playfair Display', 'Palatino Linotype', serif;
    font-size: 36px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  .brand-name em { font-style: italic; color: #ffb3c1; }
  .season-pill {
    background: #c0334d;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 30px;
  }

  /* tagline */
  .tagline-line {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: rgba(255,255,255,0.82);
    line-height: 1.5;
  }

  /* stat */
  .stat-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-top: 10px;
  }
  .stat-number {
    font-family: 'Playfair Display', 'Palatino Linotype', serif;
    font-size: 96px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1;
    letter-spacing: -3px;
  }
  .stat-number.long { font-size: 68px; }
  .stat-right { display: flex; flex-direction: column; justify-content: center; }
  .stat-desc {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.72);
    max-width: 280px;
    line-height: 1.4;
  }
  .accent-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ffb3c1;
    margin-bottom: 6px;
  }

  /* ── BODY: cream area ── */
  .body {
    width: 1080px;
    background: #fdf6ee;
    padding: 16px 18px 0;
    display: flex;
    flex-direction: column;
  }

  /* split panels */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    flex: 1;
  }
  .panel {
    border-radius: 20px;
    padding: 18px 20px 16px;
    display: flex;
    flex-direction: column;
  }
  .panel-bad {
    background: #f0ece7;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .panel-good {
    background: linear-gradient(155deg, #fff0f4 0%, #fce4ec 100%);
    border: 1px solid rgba(192,51,77,0.14);
    box-shadow: 0 2px 16px rgba(192,51,77,0.08);
  }

  .panel-title {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 8px;
  }
  .panel-bad  .panel-title { color: #a09488; }
  .panel-good .panel-title { color: #c0334d; }

  .emoji-row {
    text-align: center;
    font-size: 72px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .points { display: flex; flex-direction: column; gap: 8px; }
  .point {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-family: 'Inter', sans-serif;
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.38;
  }
  .icon { flex-shrink: 0; font-style: normal; font-size: 13px; margin-top: 3px; font-weight: 800; }
  .panel-bad  .point { color: #7a6e66; }
  .panel-bad  .icon  { color: #b0a49a; }
  .panel-good .point { color: #3d1520; }
  .panel-good .icon  { color: #c0334d; }

  /* ── CTA bar ── */
  .cta-bar {
    background: linear-gradient(90deg, #b02d45 0%, #c0334d 50%, #b02d45 100%);
    text-align: center;
    padding: 13px 40px;
    margin-top: 14px;
  }
  .cta-text {
    font-family: 'Playfair Display', 'Palatino Linotype', serif;
    font-size: 27px;
    font-weight: 700;
    font-style: italic;
    color: #fff;
    letter-spacing: 0.2px;
  }

  /* ── Footer ── */
  .footer {
    background: #1e0a06;
    padding: 11px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .footer-url  { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; color: #c68c3a; }
  .footer-tags { font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(253,246,238,0.4); }
</style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-inner">
      <div class="header">
        <div class="brand-name">Sarah's <em>Bakery</em></div>
        <div class="season-pill">{{SEASON}}</div>
      </div>
      <div class="tagline-line">{{TAGLINE_LINE1}}</div>
      <div class="tagline-line">{{TAGLINE_LINE2}}</div>
      <div class="stat-row">
        <div class="stat-number {{STAT_CLASS}}">{{STAT}}</div>
        <div class="stat-right">
          <div class="accent-dot"></div>
          <div class="stat-desc">{{STAT_DESC}}</div>
        </div>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">
    <div class="panels">
      <div class="panel panel-bad">
        <div class="panel-title">Chain Store</div>
        <div class="emoji-row">{{BAD_EMOJI}}</div>
        <div class="points">
          <div class="point"><i class="icon">✕</i>{{BAD_1}}</div>
          <div class="point"><i class="icon">✕</i>{{BAD_2}}</div>
          <div class="point"><i class="icon">✕</i>{{BAD_3}}</div>
        </div>
      </div>
      <div class="panel panel-good">
        <div class="panel-title">Sarah's Bakery</div>
        <div class="emoji-row">{{GOOD_EMOJI}}</div>
        <div class="points">
          <div class="point"><i class="icon">✓</i>{{GOOD_1}}</div>
          <div class="point"><i class="icon">✓</i>{{GOOD_2}}</div>
          <div class="point"><i class="icon">✓</i>{{GOOD_3}}</div>
        </div>
      </div>
    </div>

    <div class="cta-bar">
      <div class="cta-text">{{CTA}}</div>
    </div>

    <div class="footer">
      <div class="footer-url">sarahsbakes.com</div>
      <div class="footer-tags">{{HASHTAGS}}</div>
    </div>
  </div>

</body>
</html>
