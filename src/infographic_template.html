<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(150deg, #2c1810 0%, #1a0e08 55%, #2c1810 100%);
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Soft decorative glows */
  .deco-top {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,182,193,0.08) 0%, transparent 65%);
    top: -150px; right: -100px;
    pointer-events: none;
  }
  .deco-bottom {
    position: absolute;
    width: 350px; height: 350px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(198,140,58,0.1) 0%, transparent 65%);
    bottom: -100px; left: -80px;
    pointer-events: none;
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 34px 50px 0;
    position: relative;
    z-index: 2;
  }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 44px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.5px;
  }
  .brand-name span { color: #e8a0b4; }
  .season-badge {
    background: rgba(232,160,180,0.15);
    border: 1px solid rgba(232,160,180,0.35);
    color: #e8a0b4;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.5px;
    padding: 7px 18px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .accent-line {
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, #e8a0b4 30%, #c68c3a 70%, transparent 100%);
    margin: 18px 50px 0;
    position: relative;
    z-index: 2;
  }

  /* ── Tagline ── */
  .tagline-block {
    padding: 16px 50px 0;
    position: relative;
    z-index: 2;
  }
  .tagline-line {
    font-size: 21px;
    font-weight: 500;
    color: rgba(250,235,215,0.75);
    line-height: 1.55;
  }

  /* ── Stat ── */
  .stat-block {
    text-align: center;
    padding: 10px 50px 0;
    position: relative;
    z-index: 2;
  }
  .stat-number {
    font-family: 'Playfair Display', serif;
    font-size: 108px;
    font-weight: 900;
    color: #f5deb3;
    line-height: 1;
    letter-spacing: -3px;
  }
  .stat-number.long { font-size: 78px; }
  .stat-desc {
    font-size: 19px;
    font-weight: 500;
    color: rgba(245,222,179,0.6);
    margin-top: 3px;
    letter-spacing: 0.2px;
  }

  /* ── Split panels ── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding: 14px 20px 0;
    flex: 1;
    position: relative;
    z-index: 2;
  }
  .panel {
    border-radius: 22px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .panel-bad {
    background: linear-gradient(160deg, #2a2a2a 0%, #181818 100%);
    border: 1px solid rgba(255,255,255,0.05);
  }
  .panel-good {
    background: linear-gradient(160deg, #6b2d4a 0%, #3d1828 100%);
    border: 1px solid rgba(232,160,180,0.22);
  }

  .panel-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 10px;
  }
  .panel-bad .panel-title { color: #777777; }
  .panel-good .panel-title { color: #e8a0b4; }

  .emoji-row {
    text-align: center;
    font-size: 70px;
    line-height: 1;
    margin-bottom: 12px;
  }

  .points { display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .point {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.4;
  }
  .point-icon { flex-shrink: 0; margin-top: 2px; font-style: normal; font-size: 15px; }
  .panel-bad .point       { color: #999999; }
  .panel-bad .point-icon  { color: #555555; }
  .panel-good .point      { color: #faebd7; }
  .panel-good .point-icon { color: #e8a0b4; }

  /* ── CTA ── */
  .cta-bar {
    background: linear-gradient(90deg, transparent 0%, rgba(232,160,180,0.18) 50%, transparent 100%);
    border-top: 1px solid rgba(232,160,180,0.25);
    border-bottom: 1px solid rgba(232,160,180,0.25);
    text-align: center;
    padding: 13px 50px;
    margin-top: 13px;
    position: relative;
    z-index: 2;
  }
  .cta-text {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    color: #e8a0b4;
    letter-spacing: 0.3px;
  }

  /* ── Footer ── */
  .footer {
    background: rgba(0,0,0,0.45);
    padding: 13px 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
  }
  .footer-url  { font-size: 17px; font-weight: 600; color: #c68c3a; letter-spacing: 0.4px; }
  .footer-tags { font-size: 13px; color: rgba(245,222,179,0.4); font-weight: 400; }
</style>
</head>
<body>
<div class="canvas">
  <div class="deco-top"></div>
  <div class="deco-bottom"></div>

  <div class="header">
    <div class="brand-name">Sarah's <span>Bakery</span></div>
    <div class="season-badge">{{SEASON}}</div>
  </div>

  <div class="accent-line"></div>

  <div class="tagline-block">
    <div class="tagline-line">{{TAGLINE_LINE1}}</div>
    <div class="tagline-line">{{TAGLINE_LINE2}}</div>
  </div>

  <div class="stat-block">
    <div class="stat-number {{STAT_CLASS}}">{{STAT}}</div>
    <div class="stat-desc">{{STAT_DESC}}</div>
  </div>

  <div class="panels">
    <div class="panel panel-bad">
      <div class="panel-title">Chain Store</div>
      <div class="emoji-row">{{BAD_EMOJI}}</div>
      <div class="points">
        <div class="point"><i class="point-icon">✕</i> {{BAD_1}}</div>
        <div class="point"><i class="point-icon">✕</i> {{BAD_2}}</div>
        <div class="point"><i class="point-icon">✕</i> {{BAD_3}}</div>
      </div>
    </div>
    <div class="panel panel-good">
      <div class="panel-title">Sarah's Bakery</div>
      <div class="emoji-row">{{GOOD_EMOJI}}</div>
      <div class="points">
        <div class="point"><i class="point-icon">✓</i> {{GOOD_1}}</div>
        <div class="point"><i class="point-icon">✓</i> {{GOOD_2}}</div>
        <div class="point"><i class="point-icon">✓</i> {{GOOD_3}}</div>
      </div>
    </div>
  </div>

  <div class="cta-bar">
    <div class="cta-text">{{CTA}}</div>
  </div>

  <div class="footer">
    <div class="footer-url">sarahsbakes.com</div>
    <div class="footer-tags">{{HASHTAGS}}</div>
  </div>
</div>
</body>
</html>
